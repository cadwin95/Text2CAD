model_list:
  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: groq-llama3
    litellm_params:
      model: groq/llama3-70b-8192
      api_key: os.environ/GROQ_API_KEY

  # Vision Model (Optional, requires local server)
  - model_name: llava
    litellm_params:
      model: openai/llava
      api_base: http://llava-server:8081/v1
      api_key: dummy-token

litellm_settings:
  success_callback: ["openpipe"]
  openpipe_api_key: os.environ/OPENPIPE_API_KEY
  drop_params: true
