[project]
name = "cadai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "typer>=0.12.3",
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    "openai>=1.44.0",
    "httpx>=0.25.0",
    "pillow>=10.0.0",
    "fastmcp>=2.13.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "flask-socketio>=5.5.1",
    "fastapi>=0.121.3",
    "trimesh>=4.9.0",
    "numpy-stl>=3.2.0",
    "matplotlib>=3.10.7",
]

[project.optional-dependencies]
training = [
    "unsloth>=2024.11",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "trl>=0.7.0",
    "datasets>=2.14.0",
]
mcp = [
    "fastmcp>=0.2.0",
]
openpipe = [
    "openpipe>=4.0.0",
]
architecture = [
    "langchain>=0.2.14",
    "langchain-openai>=0.1.25",
]

cad = [
    "freecad-stubs>=0.21.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "cadai[training,mcp,openpipe,cad]",
]

[project.scripts]
cadai = "app.cli:app"

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
markers = ["anyio: mark async tests", "integration: mark tests requiring FreeCADCmd"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
