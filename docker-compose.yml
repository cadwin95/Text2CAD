services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONPATH=/app
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

  postgres:
    image: pgvector/pgvector:pg15
    container_name: litellm_postgres
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    ports:
      - "5433:5432" # External:Internal (로컬 PostgreSQL과 충돌 방지)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d litellm -U llmproxy" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    platform: linux/amd64
    command:
      - "--config"
      - "/litellm_config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
      - "--num_workers"
      - "8"
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://llmproxy:dbpassword9090@postgres:5432/litellm}
      STORE_MODEL_IN_DB: ${LITELLM_STORE_MODEL_IN_DB:-True}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DROP_PARAMS: ${LITELLM_DROP_PARAMS:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENPIPE_API_KEY: ${OPENPIPE_API_KEY}
    volumes:
      - ./litellm_config.yaml:/litellm_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  # prometheus:
  #   image: prom/prometheus
  #   container_name: litellm_prometheus
  #   volumes:
  #     - prometheus_data:/prometheus
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
