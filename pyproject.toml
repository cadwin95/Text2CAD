[project]
name = "cadai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.35.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.3",
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    "openai>=1.44.0",
]

[project.optional-dependencies]
cad = [
    "freecad-stubs>=0.21.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
cadai = "app.cli:app"

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
markers = ["anyio: mark async tests", "integration: mark tests requiring FreeCADCmd"]
testpaths = ["tests"]
